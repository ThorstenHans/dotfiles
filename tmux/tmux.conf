# 256 colors and true color / undercurls
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-command "zsh"
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g set-clipboard on

set -g status-position bottom
set -g status-interval 10
setw -g mode-keys vi
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -gq extended-keys on
set -g history-limit 50000

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- Osaka Jade Theme Port for tmux ---
set -g pane-border-lines single
set -g pane-border-style         'fg=#3b4261,nobold'
set -g pane-active-border-style  'fg=#7aa2f7,nobold'

set -g mode-style           'fg=#81B8A8,bg=#23372B'
set -g message-style        'fg=#D6D5BC,bg=#32473B'
set -g message-command-style 'fg=#D6D5BC,bg=#32473B'
set -g popup-border-style   'fg=#7aa2f7'

# Status bar
set -g status-style          'bg=#111c18'
set -g status-left-length    80
set -g status-right-length   60

set -g status-left  '#[fg=#81B8A8,bg=#23372B,bold] #{?client_prefix,󰠠 ,󰤂 }#S #[fg=#81B8A8,bg=#23372B,nobold]'
set -g status-right '#{?window_zoomed_flag,#[fg=#e0af68,bg=#414868,bold]  ZOOM ,}#{?pane_in_mode,#[fg=#7dcfff,bg=#414868,bold]  #{pane_mode} ,}#[fg=#D6D5BC,bg=#23372B]#[fg=#63b07a,bg=#23372B]  #{client_user} '

# Windows — fsquare glyphs (nf-md-numeric_X_box) via nested conditionals, no scripts
set -g window-status-separator ''

set -g window-status-current-format '#[fg=#63b07a,bg=#111c18]#[fg=#63b07a,bg=#111c18,bold] #{?#{==:#{pane_current_command},ssh},󰣀,} #{?#{==:#{window_index},1},󰎤,#{?#{==:#{window_index},2},󰎧,#{?#{==:#{window_index},3},󰎪,#{?#{==:#{window_index},4},󰎭,#{?#{==:#{window_index},5},󰎰,#{?#{==:#{window_index},6},󰎳,#{?#{==:#{window_index},7},󰎶,#{?#{==:#{window_index},8},󰎹,#{?#{==:#{window_index},9},󰎼,#{window_index}}}}}}}}}} #[fg=#63b07a,nobold]#W #[nobold]#{?window_zoomed_flag,󰏃 ,#{?#{==:#{pane_index},1},󰎤,#{?#{==:#{pane_index},2},󰎧,#{?#{==:#{pane_index},3},󰎪,#{?#{==:#{pane_index},4},󰎭,#{pane_index}}}}} }#[fg=#63b07a,bg=#24283b,nobold]'
set -g window-status-format         '#[fg=#a9b1d6,bg=#32473B,dim] #{?#{==:#{pane_current_command},ssh},󰣀,} #{?#{==:#{window_index},1},󰎤,#{?#{==:#{window_index},2},󰎧,#{?#{==:#{window_index},3},󰎪,#{?#{==:#{window_index},4},󰎭,#{?#{==:#{window_index},5},󰎰,#{?#{==:#{window_index},6},󰎳,#{?#{==:#{window_index},7},󰎶,#{?#{==:#{window_index},8},󰎹,#{?#{==:#{window_index},9},󰎼,#{window_index}}}}}}}}}} #W '
